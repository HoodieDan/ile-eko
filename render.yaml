# Render Blueprint for the Ilé Èkó backend (free tier).
# Deploy: push this repo to GitHub → Render → New → Blueprint → pick this repo.
# You only need to paste MONGODB_URI (from MongoDB Atlas M0). JWT_SECRET and
# TASKS_TOKEN are auto-generated by Render.
services:
  - type: web
    name: ile-eko-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false # set in the Render dashboard: your Atlas M0 connection string
      - key: JWT_SECRET
        generateValue: true # Render generates a strong secret
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: SESSION_SLIDING
        value: "true"
      - key: MONGO_MAX_POOL_SIZE
        value: "5"
      # Drain the outbox in-process while the service is awake; the GitHub Actions
      # cron (below) keeps it warm and runs the daily sweep.
      - key: WORKER_INLINE
        value: "true"
      - key: TASKS_TOKEN
        generateValue: true # copy this into the GitHub repo secret TASKS_TOKEN
      - key: CORS_ORIGINS
        value: http://localhost:8081
      - key: RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: RATE_LIMIT_MAX
        value: "300"
      - key: LOG_LEVEL
        value: info
      # --- AI: left unset on purpose. The app runs fully; AI endpoints return
      # `degraded: true` until you add AI_API_KEY (+ AI_PROVIDER/AI_MODEL). ---
